</head>
<body class="font-sans antialiased text-slate-200">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;

    /* ------------------------------------------------------------------ */
    /* Icon helper — renders a Lucide icon by name using the UMD build      */
    /* ------------------------------------------------------------------ */
    function Icon({ name, className = "", size = 20, strokeWidth = 2 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons) {
          // Convert PascalCase name -> kebab-case used by lucide
          const kebab = name.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
          const iconNode = window.lucide.icons[name] || window.lucide.icons[kebab];
          ref.current.innerHTML = "";
          if (iconNode) {
            const svg = window.lucide.createElement(iconNode);
            svg.setAttribute("width", size);
            svg.setAttribute("height", size);
            svg.setAttribute("stroke-width", strokeWidth);
            svg.setAttribute("class", className);
            ref.current.appendChild(svg);
          }
        }
      }, [name, className, size, strokeWidth]);
      return <span ref={ref} className="inline-flex" aria-hidden="true" />;
    }

          {

        ],

        rates: [

            roomType: "Standard Room",

          },

    const money = (n) => `${HOTEL.currency} ${Number(n).toLocaleString("en-AE")}`;

    /* ------------------------------------------------------------------ */
    /* Small shared UI atoms                                                */

    function BrandMark({ compact = false }) {
      return (
        <div className="flex items-center gap-3">
          <div className="relative">
            <div className="grid place-items-center w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-glow">

              <div className="text-[15px] font-extrabold tracking-tight text-white">

    function Field({ icon, label, ...props }) {
      return (
        <label className="block">

          <div className="relative">

                "focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30 " +
                (icon ? "pl-10 pr-3 " : "px-3 ")
              }
            />
          </div>
        </label>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Login screen                                                         */
    /* ------------------------------------------------------------------ */
    function LoginScreen({ onLogin, users }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [showPw, setShowPw] = useState(false);

      const submit = (e) => {
        e.preventDefault();
        const match = users.find(
          (u) => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password
        );
        if (!match) {
          setError("Invalid username or password. Please check your credentials and try again.");
          return;
        }
        setError("");
        onLogin(match);
      };

      return (
        <div className="min-h-full w-full bg-slate-950 relative overflow-hidden">
          {/* ambient glow */}
          <div className="pointer-events-none absolute -top-40 -right-40 h-96 w-96 rounded-full bg-amber-500/10 blur-3xl" />
          <div className="pointer-events-none absolute -bottom-40 -left-40 h-96 w-96 rounded-full bg-amber-600/5 blur-3xl" />

          <div className="relative mx-auto flex min-h-full max-w-md flex-col items-center justify-center px-5 py-12">
            <div className="mb-8 flex flex-col items-center text-center">
              <BrandMark compact />
              <h1 className="mt-5 text-2xl font-extrabold tracking-tight text-white">
                {HOTEL.name}
              </h1>
              <p className="mt-1 text-sm text-slate-400">
                Confidential contracted rates for travel partners
              </p>
            </div>

            <form
              onSubmit={submit}
              className="w-full rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-2xl backdrop-blur sm:p-7"
            >
              <div className="mb-5 flex items-center gap-2">
                <Icon name="Lock" size={18} className="text-amber-500" />
                <h2 className="text-base font-bold text-white">Partner Sign In</h2>
              </div>

              {error && (
                <div className="mb-4 flex items-start gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2.5 text-sm text-red-300">
                  <span className="mt-0.5"><Icon name="TriangleAlert" size={16} /></span>
                  <span>{error}</span>
                </div>
              )}

              <div className="space-y-4">
                <Field
                  icon="User"
                  label="Agency Username"
                  type="text"
                  autoComplete="username"
                  placeholder="e.g. akbar"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                />
                <div>
                  <span className="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-slate-400">
                    Password
                  </span>
                  <div className="relative">
                    <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
                      <Icon name="Lock" size={18} />
                    </span>
                    <input
                      type={showPw ? "text" : "password"}
                      autoComplete="current-password"
                      placeholder="••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full rounded-lg border border-slate-700 bg-slate-950/60 py-2.5 pl-10 pr-11 text-sm text-white placeholder-slate-500 outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPw((s) => !s)}
                      className="absolute right-2.5 top-1/2 -translate-y-1/2 rounded-md p-1 text-slate-500 hover:text-amber-500"
                      aria-label={showPw ? "Hide password" : "Show password"}
                    >
                      <Icon name={showPw ? "EyeOff" : "Eye"} size={18} />
                    </button>
                  </div>
                </div>
              </div>

              <button
                type="submit"
                className="mt-6 flex w-full items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-amber-400 to-amber-600 px-4 py-2.5 text-sm font-bold text-slate-950 shadow-glow transition hover:from-amber-300 hover:to-amber-500 active:scale-[.99]"
              >
                <Icon name="LogIn" size={18} strokeWidth={2.4} />
                Access Rates Portal
              </button>

              <div className="mt-5 rounded-lg border border-slate-800 bg-slate-950/50 p-3.5">
                <div className="mb-2 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-amber-500/90">
                  <Icon name="Info" size={13} /> Demo Credentials
                </div>
                <ul className="space-y-1 text-xs text-slate-400">
                  <li><span className="text-slate-300 font-semibold">Admin:</span> admin / admin123</li>
                  <li><span className="text-slate-300 font-semibold">Akbar Travels:</span> akbar / 123</li>
                  <li><span className="text-slate-300 font-semibold">Rayna Tours:</span> rayna / 123</li>
                </ul>
              </div>
            </form>

            <p className="mt-6 text-center text-[11px] text-slate-600">
              © {HOTEL.year} {HOTEL.name}. Rates are confidential and for contracted partners only.
            </p>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Shared top header (dashboards)                                       */
    /* ------------------------------------------------------------------ */
    function TopBar({ user, onLogout, children }) {
      return (
        <header className="no-print sticky top-0 z-20 border-b border-slate-800 bg-slate-950/85 backdrop-blur">
          <div className="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <BrandMark />
            <div className="flex items-center gap-2 sm:gap-3">
              {children}
              <div className="hidden text-right sm:block">
                <div className="text-sm font-semibold leading-tight text-white">{user.name}</div>
                <div className="text-[11px] capitalize text-amber-500/90">{user.role} account</div>
              </div>
              <button
                onClick={onLogout}
                className="flex items-center gap-1.5 rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-red-500/50 hover:text-red-300"
              >
                <Icon name="LogOut" size={16} />
                <span className="hidden sm:inline">Logout</span>
              </button>
            </div>
          </div>
        </header>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Admin dashboard                                                      */
    /* ------------------------------------------------------------------ */
    function AdminDashboard({ user, users, onAddAgency, onLogout }) {
      const agencies = users.filter((u) => u.role === "agency");
      const [form, setForm] = useState({ name: "", username: "", password: "", baseRate: "" });
      const [notice, setNotice] = useState("");
      const [error, setError] = useState("");

      const update = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

      const submit = (e) => {
        e.preventDefault();
        setNotice(""); setError("");
        const name = form.name.trim();
        const username = form.username.trim().toLowerCase();
        const base = parseFloat(form.baseRate);
        if (!name || !username || !form.password || !form.baseRate) {
          setError("Please fill in all fields to create a new agency contract.");
          return;
        }
        if (users.some((u) => u.username.toLowerCase() === username)) {
          setError(`Username "${username}" is already taken. Choose another.`);
          return;
        }
        if (isNaN(base) || base <= 0) {
          setError("Standard Room base rate must be a positive number.");
          return;
        }
        onAddAgency({ name, username, password: form.password, baseRate: base });
        setNotice(`Agency "${name}" created. Login: ${username} / ${form.password}`);
        setForm({ name: "", username: "", password: "", baseRate: "" });
      };

      const stats = [
        { label: "Active Contracts", value: agencies.length, icon: "FileText" },
        { label: "Room Categories", value: 2, icon: "BedDouble" },
        { label: "Rate Seasons", value: 3, icon: "CalendarRange" },
      ];

      return (
        <div className="min-h-full bg-slate-950">
          <TopBar user={user} onLogout={onLogout}>
            <span className="hidden items-center gap-1.5 rounded-full border border-amber-500/30 bg-amber-500/10 px-3 py-1 text-xs font-semibold text-amber-400 md:flex">
              <Icon name="ShieldCheck" size={14} /> Admin Console
            </span>
          </TopBar>

          <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
            <div className="mb-6">
              <h1 className="text-2xl font-extrabold tracking-tight text-white">Sales Administration</h1>
              <p className="mt-1 text-sm text-slate-400">
                Welcome back, {user.name}. Manage travel agency contracts and portal access.
              </p>
            </div>

            {/* stats */}
            <div className="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
              {stats.map((s) => (
                <div key={s.label} className="flex items-center gap-4 rounded-xl border border-slate-800 bg-slate-900 p-4">
                  <div className="grid h-11 w-11 place-items-center rounded-lg bg-amber-500/10 text-amber-500">
                    <Icon name={s.icon} size={22} />
                  </div>
                  <div>
                    <div className="text-2xl font-extrabold text-white">{s.value}</div>
                    <div className="text-xs uppercase tracking-wider text-slate-400">{s.label}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="grid grid-cols-1 gap-6 lg:grid-cols-5">
              {/* Add agency form */}
              <section className="lg:col-span-2">
                <div className="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-6">
                  <div className="mb-5 flex items-center gap-2">
                    <Icon name="UserPlus" size={18} className="text-amber-500" />
                    <h2 className="text-base font-bold text-white">Add New Travel Agency</h2>
                  </div>

                  {error && (
                    <div className="mb-4 flex items-start gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2.5 text-sm text-red-300">
                      <span className="mt-0.5"><Icon name="TriangleAlert" size={16} /></span>
                      <span>{error}</span>
                    </div>
                  )}
                  {notice && (
                    <div className="mb-4 flex items-start gap-2 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2.5 text-sm text-emerald-300">
                      <span className="mt-0.5"><Icon name="CircleCheck" size={16} /></span>
                      <span>{notice}</span>
                    </div>
                  )}

                  <form onSubmit={submit} className="space-y-4">
                    <Field icon="Building2" label="Agency Name" placeholder="e.g. Blue Sky Holidays"
                      value={form.name} onChange={update("name")} />
                    <Field icon="User" label="Username" placeholder="e.g. bluesky"
                      value={form.username} onChange={update("username")} />
                    <Field icon="Lock" label="Password" type="text" placeholder="Set a password"
                      value={form.password} onChange={update("password")} />
                    <Field icon="BadgeDollarSign" label="Standard Room Base Rate (AED)" type="number" min="1"
                      placeholder="e.g. 450" value={form.baseRate} onChange={update("baseRate")} />

                    <p className="text-[11px] text-slate-500">
                      Seasonal rates are auto-generated from the base rate: High Season +50%, Exhibitions +130%. A Deluxe tier is added at +35%.
                    </p>

                    <button type="submit"
                      className="flex w-full items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-amber-400 to-amber-600 px-4 py-2.5 text-sm font-bold text-slate-950 shadow-glow transition hover:from-amber-300 hover:to-amber-500 active:scale-[.99]">
                      <Icon name="Plus" size={18} strokeWidth={2.5} /> Create Agency Contract
                    </button>
                  </form>
                </div>
              </section>

              {/* Contracts grid */}
              <section className="lg:col-span-3">
                <div className="mb-3 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="Users" size={18} className="text-amber-500" />
                    <h2 className="text-base font-bold text-white">Active Agency Contracts</h2>
                  </div>
                  <span className="rounded-full bg-slate-800 px-2.5 py-1 text-xs font-semibold text-slate-300">
                    {agencies.length} total
                  </span>
                </div>

                <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                  {agencies.map((a) => (
                    <div key={a.id} className="rounded-xl border border-slate-800 bg-slate-900 p-4 transition hover:border-amber-500/40">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <div className="grid h-10 w-10 place-items-center rounded-lg bg-slate-800 text-amber-500">
                            <Icon name="Building2" size={20} />
                          </div>
                          <div>
                            <div className="font-bold text-white leading-tight">{a.name}</div>
                            <div className="text-[11px] text-slate-500">{a.contractRef || "Pending ref"}</div>
                          </div>
                        </div>
                        <span className="flex items-center gap-1 rounded-full bg-emerald-500/10 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-emerald-400">
                          <Icon name="CircleCheck" size={11} /> Active
                        </span>
                      </div>

                      <div className="mt-4 space-y-2 rounded-lg border border-slate-800 bg-slate-950/50 p-3 text-xs">
                        <div className="flex items-center justify-between">
                          <span className="flex items-center gap-1.5 text-slate-400"><Icon name="User" size={13} /> Username</span>
                          <span className="font-mono font-semibold text-slate-200">{a.username}</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="flex items-center gap-1.5 text-slate-400"><Icon name="Key" size={13} /> Password</span>
                          <span className="font-mono font-semibold text-slate-200">{a.password}</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="flex items-center gap-1.5 text-slate-400"><Icon name="BedDouble" size={13} /> Standard (Low)</span>
                          <span className="font-semibold text-amber-400">{money(a.rates[0].lowSeason)}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </div>
          </main>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Agency dashboard                                                     */
    /* ------------------------------------------------------------------ */
    function SeasonColumn({ tone, icon, title, subtitle, value }) {
      const tones = {
        low: "border-sky-500/25 bg-sky-500/[0.06]",
        high: "border-amber-500/30 bg-amber-500/[0.07]",
        exhibition: "border-fuchsia-500/25 bg-fuchsia-500/[0.06]",
      };
      const accents = {
        low: "text-sky-400",
        high: "text-amber-400",
        exhibition: "text-fuchsia-400",
      };
      return (
        <div className={"print-pill rounded-xl border p-3 text-center " + tones[tone]}>
          <div className={"mb-1 flex items-center justify-center gap-1 " + accents[tone]}>
            <Icon name={icon} size={13} />
            <span className="text-[10px] font-bold uppercase tracking-wider">{title}</span>
          </div>
          <div className="text-lg font-extrabold text-white sm:text-xl print-accent">{money(value)}</div>
          <div className="mt-0.5 text-[10px] text-slate-400">{subtitle}</div>
        </div>
      );
    }

    function RateCard({ rate }) {
      return (
        <div className="print-card rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-lg transition hover:border-amber-500/40">
          <div className="flex items-start justify-between gap-3">
            <div>
              <h3 className="text-lg font-extrabold text-white">{rate.roomType}</h3>
              <div className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-400">
                <span className="flex items-center gap-1"><Icon name="Utensils" size={13} className="text-amber-500" /> {rate.mealPlan}</span>
                <span className="flex items-center gap-1"><Icon name="Users" size={13} className="text-amber-500" /> {rate.occupancy}</span>
              </div>
            </div>
            <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-amber-500/10 text-amber-500">
              <Icon name="BedDouble" size={22} />
            </div>
          </div>

          <div className="mt-4 grid grid-cols-3 gap-2.5">
            <SeasonColumn tone="low" icon="Snowflake" title="Low Season" subtitle="May – Sep" value={rate.lowSeason} />
            <SeasonColumn tone="high" icon="Sun" title="High Season" subtitle="Oct – Apr" value={rate.highSeason} />
            <SeasonColumn tone="exhibition" icon="Sparkles" title="Exhibitions" subtitle="Major Events" value={rate.exhibition} />
          </div>

          <div className="mt-4 space-y-1.5 border-t border-slate-800 pt-3 text-[11px] text-slate-400">
            <div className="flex items-center gap-1.5">
              <Icon name="ReceiptText" size={13} className="text-amber-500/80" />
              Rates are per room / per night, inclusive of 5% VAT &amp; 7% Municipality Fee.
            </div>
            <div className="flex items-center gap-1.5">
              <Icon name="Info" size={13} className="text-amber-500/80" />
              15 AED Tourism Dirham per room / night payable directly at the hotel.
            </div>
          </div>
        </div>
      );
    }

    function AgencyDashboard({ user, onLogout }) {
      const printSheet = () => window.print();

      return (
        <div className="min-h-full bg-slate-950 print-area">
          <TopBar user={user} onLogout={onLogout}>
            <button
              onClick={printSheet}
              className="flex items-center gap-1.5 rounded-lg bg-gradient-to-r from-amber-400 to-amber-600 px-3 py-2 text-sm font-bold text-slate-950 shadow-glow transition hover:from-amber-300 hover:to-amber-500 active:scale-[.99]"
            >
              <Icon name="Download" size={16} strokeWidth={2.4} />
              <span className="hidden sm:inline">Print / Download PDF</span>
              <span className="sm:hidden">PDF</span>
            </button>
          </TopBar>

          <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
            {/* Welcome banner */}
            <div className="relative overflow-hidden rounded-2xl border border-amber-500/20 bg-gradient-to-br from-slate-900 via-slate-900 to-slate-950 p-6 shadow-glow sm:p-8">
              <div className="pointer-events-none absolute -right-16 -top-16 h-56 w-56 rounded-full bg-amber-500/10 blur-3xl no-print" />
              <div className="relative flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                  <div className="mb-2 inline-flex items-center gap-1.5 rounded-full border border-amber-500/30 bg-amber-500/10 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-amber-400">
                    <Icon name="ShieldCheck" size={13} /> Contracted Partner
                  </div>
                  <h1 className="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
                    Welcome, {user.name}
                  </h1>
                  <p className="mt-1.5 text-sm text-slate-400">
                    Confidential negotiated rates with {HOTEL.name} · {HOTEL.location}
                  </p>
                  <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-500">
                    <span className="flex items-center gap-1.5"><Icon name="FileText" size={13} /> Contract {user.contractRef}</span>
                    <span className="flex items-center gap-1.5"><Icon name="CalendarRange" size={13} /> Valid {HOTEL.year}</span>
                  </div>
                </div>
                <button
                  onClick={printSheet}
                  className="no-print flex shrink-0 items-center justify-center gap-2 rounded-xl border border-amber-500/40 bg-slate-950/40 px-4 py-3 text-sm font-bold text-amber-400 transition hover:bg-amber-500/10"
                >
                  <Icon name="Download" size={18} strokeWidth={2.3} />
                  Print / Download PDF
                </button>
              </div>
            </div>

            {/* Rate grid */}
            <div className="mb-4 mt-8 flex items-center gap-2">
              <Icon name="Tag" size={18} className="text-amber-500" />
              <h2 className="text-lg font-bold text-white">Contracted Room Rates</h2>
              <span className="ml-1 rounded-full bg-slate-800 px-2.5 py-0.5 text-xs font-semibold text-slate-300 no-print">
                {user.rates.length} categories
              </span>
            </div>

            <div className="grid grid-cols-1 gap-5 md:grid-cols-2">
              {user.rates.map((r, i) => <RateCard key={i} rate={r} />)}
            </div>

            {/* Global terms footer */}
            <div className="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-5 print-card">
              <div className="mb-3 flex items-center gap-2">
                <Icon name="ScrollText" size={16} className="text-amber-500" />
                <h3 className="text-sm font-bold text-white">Contract Terms &amp; Conditions</h3>
              </div>
              <ul className="grid grid-cols-1 gap-2 text-xs text-slate-400 sm:grid-cols-2">
                <li className="flex items-start gap-2"><span className="mt-0.5 text-amber-500"><Icon name="Check" size={13} /></span> All rates are inclusive of 5% VAT &amp; 7% Municipality Fee.</li>
                <li className="flex items-start gap-2"><span className="mt-0.5 text-amber-500"><Icon name="Check" size={13} /></span> 15 AED Tourism Dirham per room / night payable at the hotel.</li>
                <li className="flex items-start gap-2"><span className="mt-0.5 text-amber-500"><Icon name="Check" size={13} /></span> Low Season: May–Sep · High Season: Oct–Apr · Exhibitions: major event dates.</li>
                <li className="flex items-start gap-2"><span className="mt-0.5 text-amber-500"><Icon name="Check" size={13} /></span> Rates are confidential, non-commissionable and net to the agency.</li>
              </ul>
              <p className="mt-4 text-center text-[11px] text-slate-600">
                © {HOTEL.year} {HOTEL.name} · Generated for {user.name} · This document is confidential.
              </p>
            </div>
          </main>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Root app — auth state + role routing                                 */
    /* ------------------------------------------------------------------ */
    function App() {
      const [users, setUsers] = useState(initialUsers);
      const [currentUser, setCurrentUser] = useState(null);

      const handleLogin = (user) => setCurrentUser(user);
      const handleLogout = () => setCurrentUser(null);

      const handleAddAgency = ({ name, username, password, baseRate }) => {
        const high = Math.round(baseRate * 1.5);
        const exhibition = Math.round(baseRate * 2.3);
        const dlxLow = Math.round(baseRate * 1.35);
        const newAgency = {
          id: "u-" + username,
          username,
          password,
          role: "agency",
          name,
          contractRef: "GCH-" + HOTEL.year + "-" + username.slice(0, 3).toUpperCase() + "-" + Math.floor(100 + Math.random() * 899),
          createdAt: new Date().toISOString().slice(0, 10),
          rates: [
            { roomType: "Standard Room", mealPlan: "Bed & Breakfast", occupancy: "Single / Double", lowSeason: baseRate, highSeason: high, exhibition },
            { roomType: "Deluxe Room", mealPlan: "Bed & Breakfast", occupancy: "Single / Double", lowSeason: dlxLow, highSeason: Math.round(dlxLow * 1.5), exhibition: Math.round(dlxLow * 2.3) },
          ],
        };
        setUsers((prev) => [...prev, newAgency]);
      };

      // Keep currentUser in sync if their record changes (e.g. admin edits)
      const liveUser = useMemo(
        () => (currentUser ? users.find((u) => u.id === currentUser.id) || currentUser : null),
        [users, currentUser]
      );

      if (!liveUser) {
        return <LoginScreen onLogin={handleLogin} users={users} />;
      }
      if (liveUser.role === "admin") {
        return <AdminDashboard user={liveUser} users={users} onAddAgency={handleAddAgency} onLogout={handleLogout} />;
      }
      return <AgencyDashboard user={liveUser} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
